services:
  - type: web
    name: studyos
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      # Gemini API key for the AI Coach. Without it the AI endpoints fall back
      # to the built-in offline templates instead of failing.
      - key: GEMINI_API_KEY
        sync: false
      # Optional model override. Defaults to gemini-3.5-flash-lite.
      - key: GEMINI_MODEL
        sync: false
